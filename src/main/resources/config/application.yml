---
# ===================================================================
# Application specific properties
# Add your own application properties here, see the ApplicationProperties class
# to have type-safe configuration, like in the JHipsterProperties above
#
# More documentation is available at:
# https://www.jhipster.tech/common-application-properties/
# ===================================================================

application:
  sms:
    # 'mock' (aucun SMS réel) ou 'sendtext' (production)
    provider: ${SMS_PROVIDER:mock}
    # Nom d'expéditeur : doit être validé dans le tableau de bord SendText
    sender-name: ${SMS_SENDER_NAME:SansFile}
    sendtext-api-key: ${SENDTEXT_API_KEY:}
    sendtext-api-secret: ${SENDTEXT_API_SECRET:}
    sendtext-base-url: ${SENDTEXT_BASE_URL:https://api.sendtext.sn/v1}
    sendtext-sms-type: ${SENDTEXT_SMS_TYPE:normal}
  otp:
    expiration-seconds: ${OTP_EXPIRATION_SECONDS:300}
    max-attempts: ${OTP_MAX_ATTEMPTS:3}
    resend-cooldown-seconds: ${OTP_RESEND_COOLDOWN_SECONDS:45}
    # Code de test : accepté uniquement avec SMS_PROVIDER=mock (vide = désactivé)
    test-code: ${OTP_TEST_CODE:}
  admin:
    email: ${ADMIN_EMAIL:admin@sansfile.sn}
    password: ${ADMIN_PASSWORD:}
  storage:
    provider: ${STORAGE_PROVIDER:cloudinary}
    upload-dir: ${STORAGE_UPLOAD_DIR:uploads}
    cdn-url: ${STORAGE_CDN_URL:/api/files/}
    cloudinary:
      cloud-name: ${CLOUDINARY_CLOUD_NAME:}
      api-key: ${CLOUDINARY_API_KEY:}
      api-secret: ${CLOUDINARY_API_SECRET:}
      url: ${CLOUDINARY_URL:}
  business:
    delivery-fee: ${DELIVERY_FEE:2000}
    whatsapp-number: ${WHATSAPP_NUMBER:221778627052}
  push:
    vapid-public-key: ${VAPID_PUBLIC_KEY:}
    vapid-private-key: ${VAPID_PRIVATE_KEY:}
    subject: ${VAPID_SUBJECT:mailto:support@sansfile.sn}
