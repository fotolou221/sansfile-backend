# ===================================================================
# Spring Boot configuration for the "dev" profile.
#
# This configuration overrides the application.yml file.
#
# More information on profiles: https://www.jhipster.tech/profiles/
# More information on configuration properties: https://www.jhipster.tech/common-application-properties/
# ===================================================================

# ===================================================================
# Standard Spring Boot properties.
# Full reference is available at:
# https://docs.spring.io/spring-boot/appendix/application-properties/index.html
# ===================================================================

logging:
  level:
    ROOT: DEBUG
    tech.jhipster: DEBUG
    org.hibernate.SQL: DEBUG
    com.sansfile.app: DEBUG

spring:
  devtools:
    restart:
      enabled: true
      additional-exclude: static/**
    livereload:
      enabled: false # we use Webpack dev server + BrowserSync for livereload
  jackson2:
    serialization:
      indent-output: true
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    url: jdbc:postgresql://localhost:5432/sansfile_db
    username: sansfile_user
    password: sansfile_secure_password
    hikari:
      poolName: Hikari
      auto-commit: false
  liquibase:
    # Liquibase dev context without fake demo data
    contexts: dev
  mail:
    host: localhost
    port: 25
  messages:
    cache-duration: PT1S # 1 second, see the ISO 8601 standard
  thymeleaf:
    cache: false

server:
  port: 8080
  # make sure requests the proxy uri instead of the server one
  forward-headers-strategy: native

# ===================================================================
# JHipster specific properties
#
# Full reference is available at: https://www.jhipster.tech/common-application-properties/
# ===================================================================

jhipster:
  cache: # Cache configuration
    redis: # Redis configuration
      expiration: 3600 # By default objects stay 1 hour (in seconds) in the cache
      server: redis://localhost:6379
      cluster: false
      # server: redis://localhost:6379,redis://localhost:16379,redis://localhost:26379
      # cluster: true
  # CORS is only enabled by default with the "dev" profile
  cors:
    allowed-origins: 'http://localhost:4200,http://127.0.0.1:4200,http://localhost:8100,https://localhost:8100'
    allowed-origin-patterns: 'https://*.githubpreview.dev,http://localhost:*'
    allowed-methods: '*'
    allowed-headers: '*'
    exposed-headers: 'Authorization,Link,X-Total-Count,X-${jhipster.clientApp.name}-alert,X-${jhipster.clientApp.name}-error,X-${jhipster.clientApp.name}-params'
    allow-credentials: true
    max-age: 1800
  security:
    authentication:
      jwt:
        # Accès : 15 min (900s). Rafraîchissement : 60 jours (5184000s), renouvelé à chaque usage (session glissante)
        token-validity-in-seconds: 900
        token-validity-in-seconds-for-remember-me: 5184000
  mail: # specific JHipster mail property, for standard properties see MailProperties
    base-url: http://127.0.0.1:8080
  logging:
    use-json-format: false # By default, logs are not in Json format
    logstash: # Forward logs to logstash over a socket, used by LoggingConfiguration
      enabled: false
      host: localhost
      port: 5000
      ring-buffer-size: 512
# ===================================================================
# Application specific properties
# ===================================================================

application:
  storage:
    # Valeurs possibles : 'cloudinary' (hébergement cloud) ou 'local' (fichiers locaux dans uploads/)
    provider: ${STORAGE_PROVIDER:cloudinary}
    upload-dir: ${STORAGE_UPLOAD_DIR:uploads}
    cdn-url: ${STORAGE_CDN_URL:http://localhost:8080/api/files/}
    cloudinary:
      cloud-name: ${CLOUDINARY_CLOUD_NAME:}
      api-key: ${CLOUDINARY_API_KEY:}
      api-secret: ${CLOUDINARY_API_SECRET:}
      url: ${CLOUDINARY_URL:}
  sms:
    # Toujours simulé en développement : aucun crédit SendText consommé, le code s'affiche dans les logs
    provider: mock
  otp:
    expiration-seconds: 300
    max-attempts: 5
    resend-cooldown-seconds: 30
    test-code: '123456'
  admin:
    password: ${ADMIN_PASSWORD:admin_sansfile_2026}
